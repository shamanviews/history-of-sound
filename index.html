<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History of Sound</title>
<meta name="description" content="A history of live sound — every era, every company, every speaker they ever built.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,500&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --ink:#ececee; --dim:#8f8f98;
  --accent:#d99a3a;
  --glass:rgba(255,255,255,.05); --edge:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}

#hdr{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:18px 26px;pointer-events:none}
#hdr .brand{font:600 14px/1 Archivo,sans-serif;letter-spacing:.34em;color:var(--ink)}
#hdr .brand em{font:500 italic 14px/1 Fraunces,serif;letter-spacing:.02em;color:var(--accent);margin-left:6px}
#hdr nav{pointer-events:auto;display:flex;gap:8px}
#hdr nav a{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--dim);
  text-decoration:none;padding:9px 14px;border:1px solid transparent;border-radius:20px;
  transition:all .25s}
#hdr nav a:hover,#hdr nav a:focus-visible{color:var(--ink);border-color:var(--edge)}
#hdr nav a.on{color:var(--ink);border-color:var(--edge);background:var(--glass);backdrop-filter:blur(12px)}

#viewtitle{position:fixed;left:26px;bottom:56px;z-index:5;pointer-events:none;
  font:300 italic clamp(22px,3.4vw,46px)/1.08 Fraunces,serif;letter-spacing:.01em;
  color:var(--ink);opacity:.92;max-width:60vw}
#hint{position:fixed;left:26px;bottom:26px;z-index:5;pointer-events:none;
  font:400 12px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--dim)}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(470px,92vw);z-index:20;
  transform:translateX(105%);transition:transform .45s cubic-bezier(.22,1,.36,1);
  background:linear-gradient(160deg,rgba(20,22,36,.72),rgba(10,12,20,.82));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-left:1px solid var(--edge);padding:74px 34px 34px;overflow-y:auto}
.panel.on{transform:none}
.panel .x{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--edge);background:transparent;color:var(--ink);font-size:19px;
  cursor:pointer;transition:all .2s}
.panel .x:hover{background:var(--glass)}
.panel h2{font:600 27px/1.15 Fraunces,serif;margin:6px 0 12px}
.panel .eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent)}
.panel .lede{color:var(--dim);margin-bottom:20px}
.panel .ev{display:flex;gap:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07);
  font-size:14.5px}
.panel .yy{font:500 13px/1.7 "IBM Plex Mono",monospace;color:var(--accent);min-width:44px}
.panel b{color:var(--ink);font-weight:600}
.panel .mono{font:400 14px/1.6 "IBM Plex Mono",monospace;color:var(--accent)}
.panel .mono.dim{color:var(--dim);font-size:12.5px}
.panel .credit{margin-top:22px;font-size:11px;color:var(--dim);opacity:.75}
.panel .credit a{color:var(--dim)}
.chip{display:inline-block;font:500 11px/1 "IBM Plex Mono",monospace;color:var(--accent);
  text-decoration:none;border:1px solid rgba(217,154,58,.4);border-radius:14px;
  padding:5px 10px;margin:4px 4px 0 0;transition:all .2s}
.chip:hover{background:rgba(217,154,58,.14)}
.portal{display:block;margin:22px 0;padding:22px 24px;border-radius:14px;text-decoration:none;
  font:600 18px/1.3 Fraunces,serif;color:var(--ink);letter-spacing:.01em;
  background:rgba(217,154,58,.10);
  border:1px solid rgba(217,154,58,.45);transition:all .3s;position:relative;overflow:hidden}
.portal:hover{border-color:var(--accent);box-shadow:0 0 44px rgba(217,154,58,.22)}
.portal span{color:var(--accent)}

#cogrid{position:fixed;inset:0;z-index:8;padding:110px 5vw 60px;overflow-y:auto;
  display:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;
  align-content:start}
#cogrid.on{display:grid}
.co{border:1px solid var(--edge);border-radius:6px;overflow:hidden;text-decoration:none;
  color:var(--ink);background:rgba(255,255,255,.028);
  display:flex;flex-direction:column;justify-content:space-between;min-height:150px;padding:22px 20px 16px;
  transition:border-color .3s,background .3s}
.co:hover{border-color:rgba(217,154,58,.55);background:rgba(217,154,58,.05)}
.conm{font:600 21px/1.15 Fraunces,serif;letter-spacing:.005em}
.co:hover .conm{color:var(--accent)}
.cometa{font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.14em;
  display:flex;justify-content:space-between;margin-top:18px}

#catalog{position:fixed;inset:0;z-index:8;padding:110px 5vw 80px;overflow-y:auto;display:none}
#catalog.on{display:block}
#catalog .cathead{font:300 italic 30px/1.2 Fraunces,serif;color:var(--ink);margin:34px 0 6px}
#catalog .cathead:first-child{margin-top:0}
#catalog .catsub{font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.16em;margin-bottom:14px}
#catalog .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.prodcard{border:1px solid var(--edge);border-radius:6px;padding:14px 16px;cursor:pointer;
  background:rgba(255,255,255,.028);transition:border-color .25s,background .25s}
.prodcard:hover{border-color:rgba(217,154,58,.55);background:rgba(217,154,58,.05)}
.prodcard .pn{font:600 16px/1.2 Fraunces,serif}
.prodcard:hover .pn{color:var(--accent)}
.prodcard .pd{font:400 10px/1.5 "IBM Plex Mono",monospace;color:var(--dim);margin-top:6px}
.panel .speclist{margin-top:14px}
.panel .speclist div{font:400 12.5px/1.7 "IBM Plex Mono",monospace;color:var(--dim);
  border-top:1px solid rgba(255,255,255,.06);padding:7px 0}
.panel .imgdesc{font:400 13.5px/1.6 Archivo,sans-serif;color:var(--dim);margin:4px 0 14px;font-style:italic}
#veil{position:fixed;inset:0;z-index:40;background:var(--bg);opacity:0;pointer-events:none;
  transition:opacity .38s}
#veil.on{opacity:1}

#foot{position:fixed;right:26px;bottom:26px;z-index:5;font:400 10.5px/1 "IBM Plex Mono",monospace;
  color:var(--dim);opacity:.6}
#foot a{color:var(--dim)}

@media (max-width:640px){
  #viewtitle{max-width:88vw;bottom:66px}
  #foot{display:none}
  #hdr{padding:14px 16px}
  .panel{width:100vw;border-left:none}
}
@media (prefers-reduced-motion:reduce){
  .panel{transition:none}
}
</style>
</head>
<body data-view="timeline">
<canvas id="gl"></canvas>
<header id="hdr">
  <div class="brand">HISTORY OF SOUND<em>est. 1876</em></div>
  <nav>
    <a href="#/" id="nav-t">TIMELINE</a>
    <a href="#/companies" id="nav-c">COMPANIES</a>
  </nav>
</header>
<div id="viewtitle"></div>
<div id="hint"></div>
<div id="cogrid"></div>
<div id="catalog"></div>
<aside class="panel" id="panel"></aside>
<aside class="panel" id="prod"></aside>
<div id="veil"></div>
<div id="foot">independent reference · not affiliated with any manufacturer · <a href="#" id="credits-link">image credits</a></div>

  const h=location.hash||'#/';
  document.getElementById('nav-t').classList.toggle('on',h==='#/'||h==='');
  document.getElementById('nav-c').classList.toggle('on',h==='#/companies');
}upnav();
</script>
