<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History of Sound</title>
<meta name="description" content="A history of live sound — every era, every company, every speaker they ever built.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Expanded:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e7e1; --ink:#101010; --dim:#6d6d68;
  --brass:#9a7328; --line:#101010; --hair:rgba(16,16,16,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.55 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--brass);color:#fff}
a{color:inherit;text-decoration:none}
.mono{font-family:"IBM Plex Mono",monospace}

.wrap{padding:0 4vw}

/* header */
#hdr{display:flex;justify-content:space-between;align-items:center;padding:22px 4vw;
  position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);z-index:30;border-bottom:1px solid var(--hair)}
#hdr .brand{font:600 13px/1 "Archivo Expanded",Archivo,sans-serif;letter-spacing:.26em}
#hdr nav{display:flex;gap:26px}
#hdr nav a{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--dim)}
#hdr nav a.on,#hdr nav a:hover{color:var(--ink)}

/* hero */
.hero{padding:11vh 4vw 7vh}
.hero .eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.34em;color:var(--dim);
  text-transform:uppercase;margin-bottom:4vh}
.hero h1{font:700 clamp(52px,10.5vw,164px)/0.94 "Archivo Expanded",Archivo,sans-serif;
  letter-spacing:-.015em;text-transform:uppercase;border-bottom:2px solid var(--line);
  padding-bottom:3vh;text-wrap:balance}
.hero .sub{display:flex;justify-content:flex-end;margin-top:3.5vh}
.hero .sub p{max-width:560px;text-align:right;
  font:500 clamp(17px,1.9vw,25px)/1.4 Archivo,sans-serif;text-transform:uppercase}

/* section head */
.shead{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--line);padding:16vh 0 2vh;margin-bottom:0}
.shead h2{font:700 clamp(30px,5vw,64px)/1 "Archivo Expanded",Archivo,sans-serif;
  text-transform:uppercase;letter-spacing:-.01em}
.shead .cnt{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--dim)}

/* era + generic rows */
.row{border-bottom:1px solid var(--hair);cursor:pointer}
.row .rowhead{display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:baseline;
  padding:26px 0;transition:background .2s}
.row .rowhead:hover{background:rgba(16,16,16,.035)}
.row .num{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.1em}
.row .rtitle{font:600 clamp(24px,3.4vw,46px)/1.04 "Archivo Expanded",Archivo,sans-serif;
  letter-spacing:-.01em}
.row:hover .rtitle{color:var(--brass)}
.row .rmeta{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.14em;white-space:nowrap}
.row .body{display:none;padding:10px 0 44px}
.row.open .body{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:44px}
.row.open .rtitle{color:var(--brass)}
.body figure img{width:100%;display:block;filter:grayscale(12%) contrast(1.02)}
.body figcaption{font:400 11px/1.6 "IBM Plex Mono",monospace;color:var(--dim);margin-top:8px}
.body figcaption a{text-decoration:underline}
.body .gallery{display:flex;gap:10px;margin-top:10px}
.body .gallery img{width:31%;cursor:pointer;opacity:.85}
.body .gallery img:hover{opacity:1}
.ev{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px}
.ev:first-child{border-top:none}
.ev .yy{font:500 12px/1.7 "IBM Plex Mono",monospace;color:var(--brass)}
.ev b{font-weight:600}
.lede{font:500 17px/1.5 Archivo,sans-serif;max-width:640px;margin-bottom:18px}
.chip{display:inline-block;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;
  border:1px solid var(--hair);padding:5px 9px;border-radius:2px;margin:6px 4px 0 0;text-transform:uppercase}
.chip:hover{border-color:var(--brass);color:var(--brass)}

/* marquee */
.marq{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;
  padding:26px 0;margin-top:16vh}
.marq .inner{display:inline-block;animation:scroll 36s linear infinite;
  font:600 clamp(26px,4vw,52px)/1 "Archivo Expanded",Archivo,sans-serif;text-transform:uppercase}
.marq .st{color:var(--brass);padding:0 3vw}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq .inner{animation:none}}

/* companies rows */
.corow .rowhead{grid-template-columns:80px 1fr auto auto}
.arrow{font:400 22px/1 Archivo;color:var(--dim)}
.row:hover .arrow{color:var(--brass)}

/* company page + catalog share page hero */
.pagehero{padding:9vh 4vw 0}
.pagehero .eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.pagehero h1{font:700 clamp(40px,8vw,120px)/0.95 "Archivo Expanded",Archivo,sans-serif;
  text-transform:uppercase;letter-spacing:-.015em;border-bottom:2px solid var(--line);
  padding:1.5vh 0 2.5vh;text-wrap:balance}
.pagehero .bio{display:flex;justify-content:space-between;gap:30px;margin:3vh 0 0;flex-wrap:wrap}
.pagehero .bio p{max-width:560px;font:500 17px/1.5 Archivo}
.backlink{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--dim)}
.backlink:hover{color:var(--brass)}

.portalrow{display:flex;justify-content:space-between;align-items:center;
  border:2px solid var(--line);margin:7vh 4vw;padding:34px 30px;cursor:pointer;
  transition:background .2s,color .2s}
.portalrow:hover{background:var(--ink);color:var(--bg)}
.portalrow .pt{font:700 clamp(20px,3.4vw,44px)/1 "Archivo Expanded",Archivo,sans-serif;text-transform:uppercase}
.portalrow .arrow{font-size:34px}
.portalrow:hover .arrow{color:var(--brass)}

/* catalog */
.cathead{font:700 clamp(24px,3.6vw,48px)/1 "Archivo Expanded",Archivo,sans-serif;
  text-transform:uppercase;border-bottom:2px solid var(--line);padding:9vh 0 12px;
  display:flex;justify-content:space-between;align-items:baseline}
.cathead .cnt{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--dim)}
.prodrow{display:grid;grid-template-columns:80px 1fr auto auto;gap:20px;align-items:baseline;
  padding:16px 0;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .2s}
.prodrow:hover{background:rgba(16,16,16,.035)}
.prodrow .pn{font:600 clamp(17px,2vw,24px)/1.1 "Archivo Expanded",Archivo,sans-serif}
.prodrow:hover .pn{color:var(--brass)}
.prodrow .dims{font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.06em}
.prodbody{display:none;padding:6px 0 34px 100px;border-bottom:1px solid var(--hair)}
.prodbody.open{display:block}
.prodbody .speck{font:400 13px/1.9 "IBM Plex Mono",monospace;color:#3c3c38;max-width:760px}
.prodbody .speck div{border-top:1px solid var(--hair);padding:6px 0}
.prodbody .note{font:400 11px/1.6 "IBM Plex Mono",monospace;color:var(--dim);margin-top:10px}

/* footer */
#foot{border-top:2px solid var(--line);margin-top:16vh;padding:34px 4vw 60px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;
  font:400 11px/1.7 "IBM Plex Mono",monospace;color:var(--dim)}
#foot a{text-decoration:underline}

/* credits overlay */
#credits{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow-y:auto;padding:8vh 4vw}
#credits.on{display:block}
#credits h2{font:700 clamp(28px,5vw,60px)/1 "Archivo Expanded";text-transform:uppercase;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:8px}
#credits .cr{font:400 12px/1.8 "IBM Plex Mono",monospace;color:#3c3c38;border-bottom:1px solid var(--hair);padding:9px 0}
#credits .x{position:fixed;top:20px;right:4vw;font:500 12px/1 "IBM Plex Mono";letter-spacing:.2em;
  background:none;border:1px solid var(--line);padding:10px 16px;cursor:pointer}
#credits .x:hover{background:var(--ink);color:var(--bg)}

@media (max-width:700px){
  .row .rowhead{grid-template-columns:44px 1fr auto;gap:10px}
  .row.open .body{grid-template-columns:1fr}
  .prodbody{padding-left:0}
  .hero .sub p{text-align:left}
  .corow .rowhead{grid-template-columns:44px 1fr auto}
  .corow .rmeta{display:none}
}
</style>
</head>

em built on Lansing components."},{y:1941,x:"<b>Altec Lansing formed</b> \u2014 Altec Service absorbs bankrupt Lansing Manufacturing."},{y:1945,x:"<b>Voice of the Theatre</b> \u2014 the A-series becomes the standard loudspeaker of cinema and early PA; 'tannoy' enters the OED a year later.",c:["tannoy"]},{y:1946,x:"<b>James B. Lansing founds JBL</b>; the D130 15-inch driver stays in production for 55 years.",c:["jbl-professional"]}]},{y:"1947\u20131969",t:"Louder than the screaming",s:"Rock and roll outgrows every existing loudspeaker. Festivals force the invention of the modern concert system.",e:[{y:1947,tech:1,x:"<b>Tannoy Dual Concentric</b> \u2014 the coaxial point source that rules studios for decades.",c:["tannoy"]},{y:1953,tech:1,x:"<b>EV Variable D</b> ends proximity effect; the RE20 lineage begins.",c:["electro-voice"]},{y:1963,x:"<b>First Academy Award ever given to an audio product</b> \u2014 EV 642 Cardiline shotgun.",c:["electro-voice"]},{y:1966,x:"<b>Clair brothers tour with the Four Seasons</b> \u2014 widely credited as the first sound company to tour with a band.",c:["clair-global"]},{y:1966,x:"<b>The Beatles' last concert</b>, Candlestick Park \u2014 sound by McCune."},{y:1967,x:"<b>Monterey Pop</b> \u2014 McCune builds the first great festival system."},{y:1968,x:"<b>Community founded</b> \u2014 first fiberglass horns; <b>QSC founded</b> the same year.",c:["community","qsc"]},{y:1969,x:"<b>Woodstock</b> \u2014 Bill Hanley, 'father of festival sound', proves half a million people can hear one stage."}]},{y:"1970\u20131974",t:"The arena-rock industrial complex",s:"Touring sound becomes an industry. One band builds the most audacious PA ever attempted.",e:[{y:1970,x:"<b>Showco founded</b>, Dallas \u2014 Led Zeppelin's sound company; later spins off Vari-Lite and merges into Clair.",c:["clair-global"]},{y:1971,x:"<b>Martin Audio founded</b> by Dave Martin \u2014 folded-horn bass bins for Pink Floyd and Supertramp.",c:["martin-audio"]},{y:1972,tech:1,x:"<b>The JM-3</b> \u2014 John Meyer builds McCune an integrated, processor-controlled concert loudspeaker. The blueprint for everything Meyer Sound will do.",c:["meyer-sound"]},{y:1973,x:"<b>Outline founded</b>, Brescia.",c:["outline"]},{y:1974,x:"<b>The Wall of Sound</b> \u2014 Owsley Stanley's 75-ton, 28,800-watt system for the Grateful Dead: the first large-scale line array in modern sound reinforcement."},{y:1974,x:"<b>Clair S4</b> \u2014 the single-box arena PA that Mick Jagger heard at a Rod Stewart show and hired for the Stones.",c:["clair-global"]}]},{y:"1975\u20131979",t:"Founding fever",s:"In five years, half of today's major manufacturers appear.",e:[{y:1977,x:"<b>JM-10</b> \u2014 Meyer's stadium follow-up for McCune debuts on the Kool Jazz tour.",c:["meyer-sound"]},{y:1978,x:"<b>EAW, Turbosound, Genelec founded</b>; Martin's 'Philishave' midrange horn starts the midrange revolution; EV patents the constant-directivity horn.",c:["eaw","turbosound","genelec","martin-audio","electro-voice"]},{y:1979,x:"<b>Meyer Sound founded</b> by John and Helen Meyer, Berkeley. First products: ACD monitor, UM-1 stage monitor \u2014 plus a custom subwoofer system for <i>Apocalypse Now</i>.",c:["meyer-sound"]},{y:1979,x:"<b>NEXO and Renkus-Heinz founded</b> the same year.",c:["nexo","renkus-heinz"]}]},{y:"1980\u20131984",t:"The trapezoid era",s:"Loudspeakers learn to array. Measurement enters the workflow.",e:[{y:1980,x:"<b>Meyer UPA-1</b> \u2014 the patented trapezoidal cabinet; the compact PA standard for a decade.",c:["meyer-sound"]},{y:1981,x:"<b>d&amp;b audiotechnik founded</b> in a Stuttgart backyard; <b>Showco's PRISM</b> system tours; Vari-Lite spins off and invents the moving light.",c:["db-audiotechnik","clair-global"]},{y:1983,x:"<b>Adamson founded</b>, Port Perry, Ontario.",c:["adamson"]},{y:1984,tech:1,x:"<b>SIM</b> \u2014 Meyer's Source Independent Measurement: tuning a PA with music as the test signal.",c:["meyer-sound"]},{y:1984,x:"<b>L-Acoustics founded</b>
